spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=contingram-projection-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.jackson.deserialization.fail-on-unknown-properties=true
platform.issuer=${OIDC_ISSUER}
platform.audience=contingram-platform
platform.public-key=${OIDC_PUBLIC_KEY}
platform.binary=${CONTINGRAM_BINARY}
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=16KB
