name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable test --locked --release --all-targets
      - run: cargo +stable test --locked --doc
      - run: cargo +stable run --locked -- demo
      - name: Exercise native release packaging before tagging
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=${USERPROFILE:-$HOME}=/build"
          cargo +stable build --locked --release --target "$RELEASE_TARGET"
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          target=os.environ['RELEASE_TARGET']
          binary=pathlib.Path('target')/target/'release'/('contingram.exe' if 'windows' in target else 'contingram')
          for arguments in [['--version'], ['demo'], ['telemetry', 'status']]:
              subprocess.run([str(binary), *arguments], check=True)
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          subprocess.run(['python', 'scripts/third_party_licenses.py', '--output', 'THIRD_PARTY_NOTICES.md'], check=True)
          subprocess.run(['python', 'scripts/release_archive.py', '--version', version, '--target', target,
                          '--notices', 'THIRD_PARTY_NOTICES.md'], check=True)
          for archive in pathlib.Path('dist').iterdir():
              subprocess.run(['python', 'scripts/public_gate.py', '--archive', str(archive)], check=True)
          PY
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/public_gate.py
      - run: python3 scripts/public_gate.py --self-test
      - run: python3 scripts/package_consumer.py
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked --all-targets
      - run: cargo +1.85.0 test --locked --doc
